<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HLTB for Steam</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 14px 16px;
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        color: #c7d5e0;
        background: #1b2838;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
      }
      p { margin: 0 0 12px 0; color: #8f98a0; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        padding: 6px 12px;
        background: linear-gradient(to bottom, #67c1f5 0%, #417a9b 100%);
        color: #ffffff;
        border: 0;
        border-radius: 2px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .stat { color: #8f98a0; font-size: 12px; }
      .toast {
        margin-top: 10px;
        padding: 6px 10px;
        background: rgba(103, 193, 245, 0.12);
        border: 1px solid #316282;
        border-radius: 2px;
        font-size: 12px;
        color: #c7d5e0;
      }
      .toast[hidden] { display: none; }
    </style>
  </head>
  <body>
    <h1 data-i18n="popup_title"></h1>
    <p data-i18n="popup_status_ok"></p>
    <div class="row">
      <span class="stat" data-slot="cache-size"></span>
      <button data-slot="clear" data-i18n="popup_clear_cache"></button>
    </div>
    <div class="toast" data-slot="toast" hidden></div>
    <script src="lib/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
